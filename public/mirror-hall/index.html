<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Hall — Getlayers Collection Nº 01</title>
<meta name="description" content="Mirror Hall: an infinitely draggable 3D carousel of glowing image-cards suspended over still, reflective water.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
  }
}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #section { position: fixed; inset: 0; }
  canvas#c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas#c.-dragging { cursor: grabbing; }

  .brand {
    position: fixed; top: clamp(28px, 6.5vh, 62px); left: 50%; transform: translateX(-50%);
    width: 92%; text-align: center; pointer-events: none; user-select: none; z-index: 2;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  }
  .brand h1 {
    margin: 0; font-weight: 400; font-size: clamp(26px, 4.6vw, 54px); line-height: 1.1;
    letter-spacing: -0.015em; color: #eef4fd;
    text-shadow: 0 2px 34px rgba(50,110,190,.45), 0 1px 3px rgba(0,0,0,.5);
  }
  .brand small { display: block; margin-top: 16px; font-size: 10.5px; letter-spacing: .3em;
    text-transform: uppercase; color: rgba(200,216,240,.45); }

  /* Card labels — CSS3D (real 3D perspective, parented to each card; crisp, never bloomed) */
  #css3d { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .card-label { white-space: nowrap; text-align: center;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; text-transform: uppercase;
    -webkit-font-smoothing: antialiased; text-shadow: 0 1px 12px rgba(0,0,0,.7);
    backface-visibility: hidden; -webkit-backface-visibility: hidden; }

  .hud { position: fixed; inset: 0; z-index: 3; pointer-events: none;
    font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: #eaf1fb; --accent: #7fd8ff; }

  .hud .vignette { position: absolute; inset: 0;
    background:
      radial-gradient(130% 90% at 50% 42%, transparent 52%, rgba(2,4,9,.55) 100%),
      linear-gradient(to bottom, rgba(2,4,9,.42) 0%, transparent 20%, transparent 62%, rgba(2,4,9,.62) 100%); }
  .hud .frame { position: absolute; inset: clamp(14px, 2.4vh, 26px);
    border: 1px solid rgba(160,200,255,.11); border-radius: 3px;
    box-shadow: inset 0 0 60px rgba(3,6,14,.5); }
  .hud .frame::before, .hud .frame::after { content: ''; position: absolute; width: 9px; height: 9px;
    border: 1px solid rgba(180,214,255,.5); }
  .hud .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .hud .frame::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  .hud .mast { position: absolute; top: clamp(30px, 6.6vh, 66px); left: 50%; transform: translateX(-50%);
    width: 92%; text-align: center; }
  .hud .mast .kicker { font-size: clamp(8.5px, .95vw, 10px); letter-spacing: .42em; text-transform: uppercase;
    color: rgba(180,206,244,.55); margin-bottom: 15px; }
  .hud .mast .kicker b { color: var(--accent); font-weight: 600; }
  .hud .mast h1 { margin: 0; font-weight: 300; font-size: clamp(30px, 5.6vw, 66px); line-height: 1;
    letter-spacing: .015em; color: #f2f7ff;
    text-shadow: 0 2px 44px rgba(70,140,220,.4), 0 1px 3px rgba(0,0,0,.55); }
  .hud .mast .sub { margin-top: 16px; font-size: clamp(10.5px, 1.25vw, 13px); font-weight: 300;
    letter-spacing: .05em; color: rgba(206,222,246,.6); }

  .hud .focus { position: absolute; bottom: clamp(34px, 7vh, 74px); left: 50%; transform: translateX(-50%);
    width: 92%; display: flex; flex-direction: column; align-items: center; gap: 13px; }
  .hud .focus .counter { display: flex; align-items: baseline; gap: 7px;
    font: 500 12px/1 ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: .16em; }
  .hud .focus .counter .num { color: var(--accent); font-size: 14px;
    text-shadow: 0 0 16px rgba(127,216,255,.5); }
  .hud .focus .counter i { color: rgba(190,214,246,.34); font-style: normal; }
  .hud .focus .counter .total { color: rgba(190,214,246,.5); }
  .hud .focus .name { font-weight: 300; font-size: clamp(20px, 3.4vw, 34px); letter-spacing: .12em;
    text-transform: uppercase; color: #eef4ff; text-shadow: 0 2px 30px rgba(50,120,200,.4), 0 1px 2px rgba(0,0,0,.6);
    will-change: transform, opacity, filter; }
  @keyframes focusSwap { from { opacity: 0; transform: translateY(9px); filter: blur(5px); }
    to { opacity: 1; transform: none; filter: blur(0); } }
  .hud .focus .name.-swap { animation: focusSwap .5s cubic-bezier(.22,.61,.36,1) both; }
  .hud .focus .dots { display: flex; align-items: center; gap: 9px; margin-top: 2px; }
  .hud .focus .dots i { width: 5px; height: 5px; border-radius: 4px; background: rgba(176,204,244,.26);
    transition: width .5s cubic-bezier(.22,.61,.36,1), background .5s ease, box-shadow .5s ease; }
  .hud .focus .dots i.-on { width: 22px; background: var(--accent); box-shadow: 0 0 12px rgba(127,216,255,.65); }

  .hud .hint { position: absolute; bottom: clamp(34px, 7vh, 74px); right: clamp(26px, 4vw, 58px);
    display: flex; align-items: center; gap: 9px; font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
    color: rgba(196,218,248,.5); transition: opacity .8s ease; }
  .hud .hint::before { content: ''; width: 22px; height: 1px; background: rgba(196,218,248,.4);
    animation: hintSlide 2.4s ease-in-out infinite; }
  @keyframes hintSlide { 0%,100% { transform: translateX(0); opacity: .35; } 50% { transform: translateX(6px); opacity: .9; } }

  .hud .mast, .hud .focus, .hud .hint { opacity: 0; transform-origin: center;
    transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.22,.61,.36,1); }
  .hud .mast { transform: translateX(-50%) translateY(-12px); }
  .hud .focus { transform: translateX(-50%) translateY(14px); }
  body.-ready .hud .mast   { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.-ready .hud .focus  { opacity: 1; transform: translateX(-50%) translateY(0); }
  body.-ready .hud .hint   { opacity: 1; }
  body.-nudged .hud .hint  { opacity: 0 !important; }
  .hud .frame { opacity: 0; transition: opacity 1.6s ease; }
  body.-ready .hud .frame { opacity: 1; }

  @media (max-width: 620px) {
    .hud .hint { display: none; }
    .hud .focus { bottom: clamp(26px, 5vh, 40px); }
  }
</style>
</head>
<body>
<div id="section">
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="vignette"></div>
    <div class="frame"></div>
    <div class="mast">
      <div class="kicker"><b>Getlayers</b> · Collection Nº 01</div>
      <h1>Mirror Hall</h1>
      <div class="sub">Liquid abstractions, suspended over still water</div>
    </div>
    <div class="focus">
      <div class="counter"><span class="num" id="focus-num">01</span><i>/</i><span class="total" id="focus-total">08</span></div>
      <div class="name" id="focus-name">Copper Vein</div>
      <div class="dots" id="focus-dots"></div>
    </div>
    <div class="hint">Drag to explore</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three'
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js'
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js'
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js'
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js'
import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js'
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js'

const hexToVec3 = (hex) => { const n = parseInt(hex.slice(1), 16); return new THREE.Vector3(((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255) }

const ASSET_BASE_URL = 'https://api.getlayers.ai/storage/v1/object/public/public/assets/mirror-hall-c3814dbf04'

const CARDS = [
  { img: `${ASSET_BASE_URL}/copper-vein.webp`,   title: 'Copper Vein' },
  { img: `${ASSET_BASE_URL}/solar-tide.webp`,    title: 'Solar Tide' },
  { img: `${ASSET_BASE_URL}/molten-drift.webp`,  title: 'Molten Drift' },
  { img: `${ASSET_BASE_URL}/silver-storm.webp`,  title: 'Silver Storm' },
  { img: `${ASSET_BASE_URL}/ink-bloom.webp`,     title: 'Ink Bloom' },
  { img: `${ASSET_BASE_URL}/gilded-smoke.webp`,  title: 'Gilded Smoke' },
  { img: `${ASSET_BASE_URL}/tide-pool.webp`,     title: 'Tide Pool' },
  { img: `${ASSET_BASE_URL}/amber-flux.webp`,    title: 'Amber Flux' },
]

const P = {
  bgColor: '#000000', fogDensity: 0, bloomStrength: 0, bloomRadius: 0, bloomThreshold: 0,
  skyTop: '#01002e', skyHorizon: '#000000', skyBottom: '#000000', skyGlow: 0,
  ringRadius: 8.5, cardW: 1.68, cardH: 2.74, cardCurve: 1, cardGap: 0.36, cardLift: 0.05,
  cornerRadius: 0.035, borderWidth: 0, borderColor: '#050505', borderOpacity: 1, hoverScale: 1.035,
  labelSize: 15, labelColor: '#d6d6d6', labelWeight: 500, labelTracking: 1, labelOffset: 0.2, labelOpacity: 0.68,
  fov: 67, camHeight: 2.02, autoSpin: 0.04, dragSpeed: 0.0085, inertiaDamp: 0.89,
  waterDeep: '#000000', waterTint: '#000000', reflBright: 0.25, rippleScale: 0.68, rippleDistort: 0.1,
  waterGlint: 0.04, fresnelPow: 2.1, reflScale: 1,
  grassCount: 0, grassHeight: 0.02, grassWidth: 0.01, grassLow: '#050505', grassTip: '#000000', windStrength: 0,
}

const canvas = document.getElementById('c')
const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true })
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2))
const DPR = renderer.getPixelRatio()

const scene = new THREE.Scene()
scene.background = new THREE.Color(P.bgColor)
scene.fog = new THREE.FogExp2(P.bgColor, P.fogDensity)

const skyUniforms = {
  uTop: { value: hexToVec3(P.skyTop) }, uHorizon: { value: hexToVec3(P.skyHorizon) },
  uBottom: { value: hexToVec3(P.skyBottom) }, uGlow: { value: P.skyGlow },
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(180, 32, 24), new THREE.ShaderMaterial({
  uniforms: skyUniforms, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `precision highp float; uniform vec3 uTop, uHorizon, uBottom; uniform float uGlow; varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 col = mix(uBottom, uHorizon, smoothstep(-0.25, 0.02, h));
      col = mix(col, uTop, smoothstep(0.02, 0.72, h));
      col += uHorizon * exp(-pow(h * 7.0, 2.0)) * uGlow;
      gl_FragColor = vec4(max(col, 0.0), 1.0);
    }`,
}))
sky.renderOrder = -1
scene.add(sky)

const camera = new THREE.PerspectiveCamera(P.fov, innerWidth / innerHeight, 0.1, 220)
camera.position.set(0, P.camHeight, 0.001)
const lookTarget = new THREE.Vector3(0, 1.15, -P.ringRadius)
camera.lookAt(lookTarget)

;(() => {
  const N = 700, pos = new Float32Array(N * 3)
  let seed = 1234.5
  const rnd = () => { seed = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return seed - Math.floor(seed) }
  for (let i = 0; i < N; i++) {
    const r = 70 + rnd() * 80, th = rnd() * Math.PI * 2, ph = (rnd() * 0.6 + 0.2) * Math.PI
    pos[i*3] = Math.sin(ph) * Math.cos(th) * r; pos[i*3+1] = Math.abs(Math.cos(ph)) * r * 0.7 + 5; pos[i*3+2] = Math.sin(ph) * Math.sin(th) * r
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3))
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x6f8bb8, size: 0.16, sizeAttenuation: true, transparent: true, opacity: 0.55, depthWrite: false })))
})()

const carousel = new THREE.Group(); scene.add(carousel)
let cardMeshes = [], cardMats = [], RING_N = 0
const maxAniso = renderer.capabilities.getMaxAnisotropy()
const loader = new THREE.TextureLoader()
loader.setCrossOrigin('anonymous')
const texCache = {}

function curvedCardGeo(w, h, R, curve) {
  const g = new THREE.PlaneGeometry(w, h, 28, 1)
  const pos = g.attributes.position
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), d = x / R
    const cx = R * Math.sin(d), cz = R * (1 - Math.cos(d))
    pos.setX(i, x + (cx - x) * curve)
    pos.setZ(i, cz * curve)
  }
  pos.needsUpdate = true
  return g
}

function makeCardMaterial(map) {
  return new THREE.ShaderMaterial({
    uniforms: {
      map: { value: map }, uAspect: { value: P.cardW / P.cardH }, uImgAspect: { value: 4 / 3 }, uRadius: { value: P.cornerRadius },
      uBorderW: { value: P.borderWidth }, uBorderCol: { value: hexToVec3(P.borderColor) }, uBorderOp: { value: P.borderOpacity },
    },
    transparent: true, extensions: { derivatives: true },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `#extension GL_OES_standard_derivatives : enable
      precision highp float;
      uniform sampler2D map; uniform float uAspect, uImgAspect, uRadius, uBorderW, uBorderOp; uniform vec3 uBorderCol; varying vec2 vUv;
      float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r; }
      void main(){
        vec2 p = (vUv - 0.5); p.x *= uAspect;
        float d = sdRR(p, vec2(0.5 * uAspect, 0.5), uRadius);
        float aa = max(fwidth(d), 1e-4);
        float inside = 1.0 - smoothstep(0.0, aa, d);
        if(inside < 0.003) discard;
        vec2 s = uAspect > uImgAspect ? vec2(1.0, uImgAspect / uAspect) : vec2(uAspect / uImgAspect, 1.0);
        vec2 iuv = (vUv - 0.5) * s + 0.5;
        vec3 tex = pow(texture2D(map, iuv).rgb, vec3(2.2));
        float border = smoothstep(-uBorderW - aa, -uBorderW + aa, d) * inside;
        vec3 col = mix(tex, uBorderCol, clamp(border, 0.0, 1.0) * uBorderOp);
        gl_FragColor = vec4(col, inside);
      }`,
  })
}

const cardLabels = []
const LABEL_SCALE = 0.008
const css3d = new CSS3DRenderer()
css3d.domElement.id = 'css3d'
document.getElementById('section').appendChild(css3d.domElement)

function getTex(src) {
  if (texCache[src]) return texCache[src]
  const t = loader.load(src, (tt) => {
    const asp = tt.image.width / tt.image.height
    for (const m of cardMats) if (m.uniforms.map.value === tt) m.uniforms.uImgAspect.value = asp
  })
  t.anisotropy = maxAniso; t.encoding = THREE.sRGBEncoding
  return (texCache[src] = t)
}

function buildRing() {
  for (const g of carousel.children.slice()) {
    carousel.remove(g)
    g.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose() })
  }
  for (const L of cardLabels) L.el.remove()
  cardLabels.length = 0; cardMeshes = []; cardMats = []
  const circ = 2 * Math.PI * P.ringRadius
  const N = Math.max(CARDS.length, Math.floor(circ / (P.cardW + P.cardGap)))
  RING_N = N
  const cardY = P.cardLift + P.cardH / 2
  for (let i = 0; i < N; i++) {
    const cd = CARDS[i % CARDS.length]
    const a = (i / N) * Math.PI * 2
    const g = new THREE.Group()
    g.position.set(Math.sin(a) * P.ringRadius, cardY, Math.cos(a) * P.ringRadius)
    g.rotation.y = a + Math.PI
    g.userData = { scale: 1 }

    const mat = makeCardMaterial(getTex(cd.img)); cardMats.push(mat)
    const img = new THREE.Mesh(curvedCardGeo(P.cardW, P.cardH, P.ringRadius, P.cardCurve), mat)
    img.userData.card = g; g.add(img); cardMeshes.push(img)

    const el = document.createElement('div'); el.className = 'card-label'; el.textContent = cd.title
    const lobj = new CSS3DObject(el); lobj.scale.setScalar(LABEL_SCALE); lobj.position.set(0, P.cardH / 2 + P.labelOffset, 0.02)
    g.add(lobj); cardLabels.push({ el, obj: lobj })
    carousel.add(g)
  }
}

const grassGroup = new THREE.Group(); scene.add(grassGroup)
let grassMat = null
function buildGrass() {
  for (const m of grassGroup.children.slice()) { grassGroup.remove(m); m.geometry.dispose(); m.material.dispose() }
  const blade = new THREE.PlaneGeometry(1, 1, 1, 5); blade.translate(0, 0.5, 0)
  const geo = new THREE.InstancedBufferGeometry()
  geo.index = blade.index; geo.attributes.position = blade.attributes.position; geo.attributes.uv = blade.attributes.uv

  const n = Math.max(0, P.grassCount | 0)
  const off = new Float32Array(n * 3), yaw = new Float32Array(n), ph = new Float32Array(n), hgt = new Float32Array(n), rand = new Float32Array(n)
  let seed = 7.13
  const rnd = () => { seed = Math.sin(seed * 91.7 + 3.1) * 43758.5453; return seed - Math.floor(seed) }
  for (let i = 0; i < n; i++) {
    const ang = rnd() * Math.PI * 2, r = 3.0 + rnd() * 1.9
    off[i*3] = Math.sin(ang) * r; off[i*3+1] = 0; off[i*3+2] = Math.cos(ang) * r
    yaw[i] = rnd() * Math.PI; ph[i] = rnd() * 6.28; hgt[i] = 0.7 + rnd() * 0.6; rand[i] = rnd()
  }
  geo.setAttribute('aOffset', new THREE.InstancedBufferAttribute(off, 3))
  geo.setAttribute('aYaw', new THREE.InstancedBufferAttribute(yaw, 1))
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(ph, 1))
  geo.setAttribute('aHeight', new THREE.InstancedBufferAttribute(hgt, 1))
  geo.setAttribute('aRand', new THREE.InstancedBufferAttribute(rand, 1))
  geo.instanceCount = n

  grassMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uHeight: { value: P.grassHeight }, uWidth: { value: P.grassWidth }, uWind: { value: P.windStrength },
      uLow: { value: hexToVec3(P.grassLow) }, uTip: { value: hexToVec3(P.grassTip) } },
    side: THREE.DoubleSide,
    vertexShader: `
      precision highp float;
      attribute vec3 aOffset; attribute float aYaw, aPhase, aHeight, aRand;
      uniform float uTime, uHeight, uWidth, uWind; varying float vH, vFade, vR;
      void main(){
        vH = uv.y; vR = aRand;
        vec3 p = position;
        p.x *= uWidth * (1.0 - uv.y * 0.82);
        p.y *= aHeight * uHeight;
        float w = sin(uTime * 1.1 + aPhase + aOffset.x * 0.5) * 0.6 + sin(uTime * 2.3 + aPhase * 1.7) * 0.4;
        float bend = (0.10 + 0.12 * w) * uWind;
        p.x += bend * uv.y * uv.y;
        p.z += 0.05 * uv.y * uv.y;
        float s = sin(aYaw), c = cos(aYaw);
        vec3 rp = vec3(p.x * c + p.z * s, p.y, -p.x * s + p.z * c) + aOffset;
        vFade = clamp(1.0 - (length(aOffset.xz) - 3.0) / 3.0, 0.0, 1.0);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(rp, 1.0);
      }`,
    fragmentShader: `precision highp float; uniform vec3 uLow, uTip; varying float vH, vFade, vR;
      void main(){
        vec3 col = mix(uLow, uTip, vH * vH);
        col *= 0.65 + 0.55 * vR;
        col *= vFade;
        gl_FragColor = vec4(col, 1.0);
      }`,
  })
  const mesh = new THREE.Mesh(geo, grassMat)
  mesh.frustumCulled = false
  grassGroup.add(mesh)
}

const TRAIL_N = 14
const trail = Array.from({ length: TRAIL_N }, () => new THREE.Vector3(0, 0, -1000))
const reflectRT = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter })
const reflectCam = new THREE.PerspectiveCamera()
const textureMatrix = new THREE.Matrix4()

const wu = {
  tReflect: { value: reflectRT.texture }, uTexMatrix: { value: textureMatrix }, uTime: { value: 0 },
  uCamPos: { value: new THREE.Vector3() },
  uDeep: { value: hexToVec3(P.waterDeep) }, uTint: { value: hexToVec3(P.waterTint) },
  uReflBright: { value: P.reflBright }, uRipScale: { value: P.rippleScale }, uRipDistort: { value: P.rippleDistort },
  uGlint: { value: P.waterGlint }, uFresnel: { value: P.fresnelPow }, uTrail: { value: trail },
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.ShaderMaterial({
  uniforms: wu,
  vertexShader: `precision highp float; uniform mat4 uTexMatrix; varying vec4 vRefl; varying vec3 vWpos;
    void main(){ vec4 wp = modelMatrix * vec4(position,1.); vWpos = wp.xyz; vRefl = uTexMatrix * vec4(position,1.);
      gl_Position = projectionMatrix * viewMatrix * wp; }`,
  fragmentShader: `
    precision highp float;
    #define TRAIL_N ${TRAIL_N}
    uniform sampler2D tReflect; uniform float uTime, uReflBright, uRipScale, uRipDistort, uGlint, uFresnel;
    uniform vec3 uCamPos, uDeep, uTint; uniform vec3 uTrail[TRAIL_N];
    varying vec4 vRefl; varying vec3 vWpos;
    void wave(vec2 p, vec2 d, float k, float w, float a, inout vec2 grad){ grad += a * k * cos(dot(d,p)*k + uTime*w) * d; }
    void main(){
      vec2 p = vWpos.xz; vec2 grad = vec2(0.0); float A = uRipScale;
      wave(p, normalize(vec2( 1.0, 0.35)), 1.7, 1.30, 0.045*A, grad);
      wave(p, normalize(vec2(-0.6, 1.0 )), 2.4, 1.05, 0.034*A, grad);
      wave(p, normalize(vec2( 0.4,-1.0 )), 3.6, 1.70, 0.022*A, grad);
      wave(p, normalize(vec2(-1.0,-0.2 )), 5.1, 2.20, 0.013*A, grad);
      float crest = 0.0;
      for(int i=0;i<TRAIL_N;i++){
        vec3 e = uTrail[i]; float age = uTime - e.z;
        if(age > 0.0 && age < 2.4){
          float d = distance(p, e.xy); float rad = age * 2.1;
          float band = exp(-pow((d - rad) * 3.2, 2.0)); float decay = (1.0 - age / 2.4);
          vec2 dir = d > 1e-4 ? (p - e.xy) / d : vec2(0.0);
          grad += dir * (-sin((d - rad) * 9.0) * 9.0 * band * decay * 0.010 * A);
          crest += cos((d - rad) * 9.0) * band * decay;
        }
      }
      vec3 N = normalize(vec3(-grad.x, 1.0, -grad.y));
      vec3 V = normalize(uCamPos - vWpos);
      vec2 ruv = vRefl.xy / vRefl.w; ruv += N.xz * uRipDistort;
      vec3 refl = texture2D(tReflect, clamp(ruv, 0.001, 0.999)).rgb * uReflBright;

      float fres = 0.02 + 0.95 * pow(1.0 - clamp(dot(V, N), 0.0, 1.0), uFresnel);
      vec3 deep = mix(uDeep, uTint, 0.25 + 0.25 * N.y);
      vec3 col = mix(deep, refl, fres);

      vec3 gdir = normalize(vec3(0.2, 1.0, -0.3)); vec3 H = normalize(gdir + V);
      float spec = pow(clamp(dot(N, H), 0.0, 1.0), 200.0);
      col += vec3(0.36, 0.5, 0.7) * spec * uGlint;
      col += refl * max(crest, 0.0) * 0.09;

      float dist = length(vWpos.xz - uCamPos.xz);
      col = mix(col, uDeep, smoothstep(14.0, 50.0, dist));

water.rotation.x = -Math.PI / 2; scene.add(water)

const _rN = new THREE.Vector3(), _rW = new THREE.Vector3(), _cW = new THREE.Vector3(), _rot = new THREE.Matrix4()
const _la = new THREE.Vector3(), _vw = new THREE.Vector3(), _tg = new THREE.Vector3(), _q = new THREE.Vector4(), _cl = new THREE.Vector4(), _pl = new THREE.Plane()
function updateReflection() {
  _rW.setFromMatrixPosition(water.matrixWorld); _cW.setFromMatrixPosition(camera.matrixWorld)
  _rot.extractRotation(water.matrixWorld); _rN.set(0, 0, 1).applyMatrix4(_rot)
  _vw.subVectors(_rW, _cW); if (_vw.dot(_rN) > 0) return
  _vw.reflect(_rN).negate().add(_rW)
  _rot.extractRotation(camera.matrixWorld)
  _la.set(0, 0, -1).applyMatrix4(_rot).add(_cW)
  _tg.subVectors(_rW, _la).reflect(_rN).negate().add(_rW)
  reflectCam.position.copy(_vw); reflectCam.up.set(0, 1, 0).applyMatrix4(_rot).reflect(_rN); reflectCam.lookAt(_tg)
  reflectCam.far = camera.far; reflectCam.updateMatrixWorld(); reflectCam.projectionMatrix.copy(camera.projectionMatrix)
  textureMatrix.set(0.5,0,0,0.5, 0,0.5,0,0.5, 0,0,0.5,0.5, 0,0,0,1)
  textureMatrix.multiply(reflectCam.projectionMatrix); textureMatrix.multiply(reflectCam.matrixWorldInverse); textureMatrix.multiply(water.matrixWorld)
  _pl.setFromNormalAndCoplanarPoint(_rN, _rW).applyMatrix4(reflectCam.matrixWorldInverse)
  _cl.set(_pl.normal.x, _pl.normal.y, _pl.normal.z, _pl.constant)
  const M = reflectCam.projectionMatrix
  _q.x = (Math.sign(_cl.x) + M.elements[8]) / M.elements[0]; _q.y = (Math.sign(_cl.y) + M.elements[9]) / M.elements[5]
  _q.z = -1.0; _q.w = (1.0 + M.elements[10]) / M.elements[14]
  _cl.multiplyScalar(2.0 / _cl.dot(_q))
  M.elements[2] = _cl.x; M.elements[6] = _cl.y; M.elements[10] = _cl.z + 1.0; M.elements[14] = _cl.w
  water.visible = false
  const prev = renderer.getRenderTarget()
  renderer.setRenderTarget(reflectRT); renderer.clear(); renderer.render(scene, reflectCam); renderer.setRenderTarget(prev)
  water.visible = true
}

const composer = new EffectComposer(renderer)
composer.addPass(new RenderPass(scene, camera))
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), P.bloomStrength, P.bloomRadius, P.bloomThreshold)
composer.addPass(bloom)
composer.addPass(new ShaderPass(GammaCorrectionShader))

let dragging = false, lastX = 0, spinVel = 0
const mouseTarget = new THREE.Vector2(), mouse = new THREE.Vector2(), ndc = new THREE.Vector2()
const raycaster = new THREE.Raycaster()
let hovered = null
const _ro = new THREE.Vector3(), _rd = new THREE.Vector3()
function pointerToWater(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -((cy / innerHeight) * 2 - 1)); raycaster.setFromCamera(ndc, camera)
  _ro.copy(raycaster.ray.origin); _rd.copy(raycaster.ray.direction)
  if (_rd.y > -1e-4) return null
  const t = (0 - _ro.y) / _rd.y; if (t <= 0 || t > 80) return null
  return { x: _ro.x + _rd.x * t, z: _ro.z + _rd.z * t }
}
let trailHead = 0, lastRx = 1e9, lastRz = 1e9
function dropRipple(cx, cy) {
  const p = pointerToWater(cx, cy); if (!p) return
  if (Math.hypot(p.x - lastRx, p.z - lastRz) < 0.14) return
  trail[trailHead].set(p.x, p.z, wu.uTime.value); trailHead = (trailHead + 1) % TRAIL_N; lastRx = p.x; lastRz = p.z
}
canvas.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; spinVel = 0; canvas.classList.add('-dragging'); canvas.setPointerCapture(e.pointerId); dropRipple(e.clientX, e.clientY); document.body.classList.add('-nudged') })
canvas.addEventListener('pointermove', (e) => {
  mouseTarget.set((e.clientX / innerWidth) * 2 - 1, -((e.clientY / innerHeight) * 2 - 1)); dropRipple(e.clientX, e.clientY)
  if (dragging) { const dx = e.clientX - lastX; lastX = e.clientX; const d = -dx * P.dragSpeed; carousel.rotation.y += d; spinVel = d }
})
const endDrag = () => { dragging = false; canvas.classList.remove('-dragging') }
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag)
function updateHover() { if (dragging) { hovered = null; return } raycaster.setFromCamera(mouseTarget, camera); const hit = raycaster.intersectObjects(cardMeshes, false)[0]; hovered = hit ? hit.object.userData.card : null }

const focusName = document.getElementById('focus-name')
const focusNum = document.getElementById('focus-num')
const dotsWrap = document.getElementById('focus-dots')
document.getElementById('focus-total').textContent = String(CARDS.length).padStart(2, '0')
const focusDots = CARDS.map(() => { const d = document.createElement('i'); dotsWrap.appendChild(d); return d })
let focusIdx = -1
function syncFocus() {
  if (!RING_N) return
  let slot = Math.round((Math.PI - carousel.rotation.y) / (2 * Math.PI) * RING_N)
  slot = ((slot % RING_N) + RING_N) % RING_N
  const idx = slot % CARDS.length
  if (idx === focusIdx) return
  focusIdx = idx
  focusName.textContent = CARDS[idx].title
  focusNum.textContent = String(idx + 1).padStart(2, '0')
  focusDots.forEach((d, i) => d.classList.toggle('-on', i === idx))
  focusName.classList.remove('-swap'); void focusName.offsetWidth; focusName.classList.add('-swap')
}

function syncLabels() {
  const y = P.cardH / 2 + P.labelOffset
  for (const L of cardLabels) {
    L.obj.position.y = y
    const s = L.el.style
    s.fontSize = P.labelSize + 'px'; s.color = P.labelColor; s.fontWeight = String(P.labelWeight)
    s.letterSpacing = P.labelTracking + 'px'; s.opacity = String(P.labelOpacity)
  }
}

function resize() {
  const w = innerWidth, h = innerHeight
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); composer.setSize(w, h); css3d.setSize(w, h)
  reflectRT.setSize(Math.floor(w * DPR * P.reflScale), Math.floor(h * DPR * P.reflScale))
}
window.addEventListener('resize', resize)

buildRing(); buildGrass(); resize(); syncFocus()
requestAnimationFrame(() => document.body.classList.add('-ready'))
let prevT = performance.now()
function frame() {
  requestAnimationFrame(frame)
  const now = performance.now(), dt = Math.min((now - prevT) / 1000, 0.05); prevT = now; const t = now / 1000
  if (!dragging) { carousel.rotation.y += spinVel + P.autoSpin * dt; spinVel *= P.inertiaDamp }
  updateHover(); syncFocus()
  for (const g of carousel.children) { const tgt = (g === hovered) ? P.hoverScale : 1; g.userData.scale += (tgt - g.userData.scale) * Math.min(1, dt * 12); g.scale.setScalar(g.userData.scale) }
  mouse.lerp(mouseTarget, 0.06)
  camera.position.x = mouse.x * 0.35; camera.position.y = P.camHeight + mouse.y * 0.18; camera.lookAt(lookTarget)
  if (grassMat) grassMat.uniforms.uTime.value = t
  wu.uTime.value = t; wu.uCamPos.value.copy(camera.position)
  updateReflection(); composer.render()
  syncLabels(); css3d.render(scene, camera)
}
frame()
